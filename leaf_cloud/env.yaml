# LEAF-Cloud Complete Environment Configuration File
# This file contains all configurable settings for the LEAF-Cloud framework

# Top-level settings
env_config_path: env.yaml
output_dir: results
enforce_constraints: true
constraint_config_path: constraints.yaml
recovery_strategy: retry
max_retries: 3
retry_delay: 5.0
gcp_region: us-central1
gcp_project_id: your-gcp-project-id

# Metric Collection Flags
collect_latency: true
collect_energy: true
collect_carbon: true
collect_scaling: true

# Simulation Parameters (nested under 'simulation')
simulation:
  duration: 3600.0
  time_step: 1.0
  iterations: 3
  warmup_period: 60.0
  max_workers: 4
  workload_type: steady
  workload_params:
    rate: 100.0

# Logging Configuration (nested under 'logging')
logging:
  log_level: INFO
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Model Parameters (nested under 'models')
models:
  energy:
    weights:
      compute: 1.0
      vm-standard: 1.0
      vm-highcpu: 1.2
      vm-highmem: 1.15
      gke-node: 1.05
      cloud-function: 0.2
      cloud-run: 0.8
      storage: 0.7
      persistent-disk: 0.5
      cloud-storage: 0.3
      cloud-sql: 0.8
      bigtable: 0.85
      firestore: 0.6
      network: 0.5
      load-balancer: 0.4
      vpn: 0.35
      cdn: 0.45
      security: 0.3
      kms: 0.25
      armor: 0.3
      default: 0.5
    functions:
      compute: { idle: 0.010, max: 0.200 }
      storage: { idle: 0.005, max: 0.10 }
      network: { idle: 0.002, max: 0.05 }
      default: { idle: 0.005, max: 0.10 }
    profiles:
      cloud-run: { idle: 0.150, max: 2.850 }
      database: { idle: 0.090, max: 1.250 }
  
  carbon:
    default_factor: 0.450
    regions:
      us-central1: 0.479
      us-east1: 0.530
      us-east4: 0.338
      us-west1: 0.130
      us-west2: 0.285
      us-west3: 0.240
      europe-west1: 0.171
      europe-west4: 0.440
      asia-east1: 0.622
      asia-southeast1: 0.490

  latency:
    # Note: The original env.yaml latency section did not match the dataclass.
    # This is a corrected structure.
    base_latency:
      compute: { vm-standard: 5.0, gke-node: 8.0, default: 10.0 }
      storage: { persistent-disk: 5.0, default: 20.0 }
    congestion_params:
      default: { threshold: 0.70, factor: 2.0, exp: 2.0 }
      
  scaling:
    request_capacity: 100.0
    cpu_threshold: 0.8
    cooldown_period: 300
    min_pods: 1
    max_pods: 100