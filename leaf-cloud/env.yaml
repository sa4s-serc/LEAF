# LEAF-Cloud Complete Environment Configuration File
# This file contains all configurable settings for the LEAF-Cloud framework

#
# Resource Type Definitions
#
env_config_path: env.yaml
resource_types:
  compute: "Virtual Machines, Kubernetes Clusters, Cloud Functions, App Engine, Cloud Run"
  storage: "Cloud Storage, Persistent Disks, Filestore"
  network: "VPC, Load Balancer, Cloud CDN, Cloud DNS, VPN, Firewall, Interconnect"
  security: "IAM, KMS, IAP, Security Center"

extended_resource_types:
  database: "Cloud SQL, Spanner, Firestore, Memorystore"
  big_data: "BigQuery Datasets, Dataflow Jobs"
  messaging: "Pub/Sub Topics, Pub/Sub Subscriptions"
  api_management: "API Gateway, API Config, API Gateway Gateway"
  developer_tools: "Cloud Build Triggers, Artifact Registry"
  operations: "Monitoring Dashboards, Logging Sinks"
  iot: "IoT Core Device Registry"
  enterprise: "Workspace, Cloud Search"

#
# Energy Model Parameters
#
energy_functions:
  # --- START OF MODIFICATIONS ---
  # Keep the old values but add new, more specific ones below.
  # The model will use the most specific match it can find.

  # Generic profiles (fallback)
  compute:
    idle: 0.010   # 10 W idle per instance (in kW)
    max: 0.200    # 200 W peak per instance (in kW)
  storage:
    idle: 0.005
    max: 0.10
  network:
    idle: 0.002
    max: 0.05
  generic:
    idle: 0.005
    max: 0.10

  # Specific profiles for calibration (NEW)
  # Calibrated to bring Cloud Run emissions up to the 100-400 g/hr range.
  cloud-run: 
    idle: 0.150   # Corresponds to a warm instance waiting for requests
    max:  2.850   # Max power draw under full load, calibrated against target
  
  # Calibrated to give Cloud SQL a realistic but lower power profile than a full VM.
  database:
    idle: 0.090   # Idle power for a managed SQL instance
    max:  1.250

energy:
  wvm: 1.2                 # Virtual machine weight factor
  wcf: 1.0                 # Cloud function weight factor
  wstorage: 1.5            # Storage weight factor
  wdisk: 1.1               # Disk weight factor
  wnetwork: 0.9            # Network weight factor
  wlb: 1.0                 # Load balancer weight factor
  base_energy: 100         # Base energy consumption

#
# Latency Model Parameters
#
latency:
  delta_congestion: 5      # Congestion delay factor
  vm_startup: 10           # VM startup time (seconds)
  container_startup: 3     # Container startup time (seconds)
  network_delay: 5         # Network communication delay (milliseconds)
  storage_access: 2        # Storage access time (milliseconds)
  iam_operation: 1         # IAM operation time (milliseconds)

#
# Carbon Emission Parameters
#
carbon:
  region_cf: 0.3           # Default regional carbon factor

#
# Scaling Parameters
#
scaling:
  g: 0.8                   # Growth factor
  Rpod: 100                # Request capacity per pod

#
# GCP Resource Parameters
#
gcp:
  default_compute_capacity: 50
  default_storage_capacity: 1000
  compute_engine:
    base_energy: 15.0
    scaling_factor: 0.75
  cloud_function:
    base_energy: 5.0
    scaling_factor: 0.5
    cold_start_penalty: 2.0
  gke:
    base_energy: 20.0
    scaling_factor: 0.85
    pod_startup_time: 5.0
  vpc:
    base_energy: 10.0
    bandwidth_energy_factor: 0.2
  storage:
    base_energy: 8.0
    read_energy: 0.05
    write_energy: 0.1
  iam:
    base_energy: 2.0
    operation_energy: 0.1

#
# Network Parameters
#
network:
  bandwidth: 1000.0        # Network bandwidth in Mbps

#
# Regional Settings
#
regions:
  us_east1:
    carbon_factor: 0.3
  europe_west1:
    carbon_factor: 0.25
  asia_east1:
    carbon_factor: 0.35
  australia_southeast1:
    carbon_factor: 0.4
  southamerica_east1:
    carbon_factor: 0.45

#
# Base Paths and Directories
#
# base_dir: /path/to/leaf-cloud        # Absolute path to the base directory
# terraform_dir: ./simple_deployment    # Path to Terraform files
# var_files:                           # List of variable files to use
#   - variables.tf
#   - terraform.tfvars
output_dir: results                  # Directory for storing results
# env_config_path: custom_env.yaml     # Optional custom env config path

#
# Simulation Parameters
#
duration: 3600.0           # Simulation time in seconds (1 hour)
time_step: 1.0             # Simulation step size in seconds
iterations: 3              # Number of simulation iterations for statistical significance
warmup_period: 60.0        # Warmup period before collecting metrics (seconds)

#
# Workload Configuration
#
workload_type: steady      # Options: steady, burst, cyclical, random, custom, mix
workload_params:
  rate: 100.0              # Base request rate (requests per second)
  
  # For burst workload (uncomment and configure as needed)
  # base_rate: 50.0
  # peak_rate: 200.0
  # burst_duration: 300.0
  # interval: 1800.0
  
  # For cyclical workload (uncomment and configure as needed)
  # min_rate: 20.0
  # max_rate: 150.0
  # period: 3600.0
  
  # For random workload (uncomment and configure as needed)
  # min_rate: 10.0
  # max_rate: 200.0
  # seed: 42
  
  # For custom workload (uncomment and configure as needed)
  # pattern_file: workload_pattern.csv
  
  # For mix workload (uncomment and configure as needed)
  # patterns:
  #   - type: steady
  #     weight: 0.6
  #     params:
  #       rate: 50.0
  #   - type: burst
  #     weight: 0.4
  #     params:
  #       base_rate: 20.0
  #       peak_rate: 150.0
  #       burst_duration: 300.0
  #       interval: 1200.0

#
# Metric Collection Flags
#
collect_latency: true      # Collect and report latency metrics
collect_energy: true       # Collect and report energy consumption metrics
collect_carbon: true       # Collect and report carbon emission metrics
collect_scaling: true      # Collect and report scaling behavior metrics

#
# Constraint Handling
#
enforce_constraints: true              # Enable constraint enforcement
constraint_config_path: constraints.yaml  # Path to constraints configuration file

#
# Recovery Strategy
#
recovery_strategy: retry   # Options: retry, ignore, abort
max_retries: 3             # Maximum number of retries on failure
retry_delay: 5.0           # Delay between retries (seconds)

#
# Concurrency
#
max_workers: 4             # Maximum worker threads for concurrent simulations

#
# GCP Specific Settings
#
gcp_region: us-central1    # Default GCP region
gcp_project_id: your-gcp-project-id  # GCP project ID

#
# Regional Carbon Factors (kg CO2e per kWh)
#
carbon_factors:
  us-central1: 0.479
  us-east1: 0.530
  us-east4: 0.338
  us-west1: 0.130
  us-west2: 0.285
  us-west3: 0.240
  europe-west1: 0.171
  europe-west4: 0.440
  asia-east1: 0.622
  asia-southeast1: 0.490

#
# Logging
#
log_level: INFO            # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
